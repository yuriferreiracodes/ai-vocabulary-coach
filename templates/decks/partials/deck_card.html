<div id="deck-{{ deck.id }}"
     class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col gap-3 {% if new %}ring-2 ring-indigo-400{% endif %}">
  <div class="flex items-start justify-between gap-2">
    <div>
      <h3 class="font-bold text-slate-800">{{ deck.title }}</h3>
      <p class="text-xs text-slate-400 mt-0.5">{{ deck.language }}</p>
    </div>
    <button hx-delete="/api/decks/{{ deck.id }}"
            hx-target="#deck-{{ deck.id }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this deck?"
            class="text-slate-300 hover:text-red-400 transition-colors text-lg leading-none">
      ×
    </button>
  </div>
  {% if deck.description %}
  <p class="text-sm text-slate-500">{{ deck.description }}</p>
  {% endif %}
  <div class="flex items-center justify-between mt-auto">
    <span class="text-xs text-slate-400">{{ deck.flashcards | length }} cards</span>
    <a href="/decks/{{ deck.id }}"
       class="text-sm text-indigo-600 font-semibold hover:underline">
      Study →
    </a>
  </div>
</div>
